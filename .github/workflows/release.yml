name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Build release
        run: composer run-script build

      - name: Version
        id: version
        run: |-
          echo PASS2CF_VERSION="$(composer run-script version)" \
            >> "$GITHUB_OUTPUT"
          git log $(git describe --tags --abbrev=0)..HEAD --oneline \
            > changes.txt

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: "v${{ steps.version.outputs.PASS2CF_VERSION }}"
        run: |-
          gh release create "$TAG" pass2cf.zip \
            --draft \
            --notes-file changes.txt \
            --title "$TAG"
